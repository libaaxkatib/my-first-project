<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> My Bio card</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <button id="theme-toggle" class="theme-toggle"> <i class="fa-solid fa-moon"></i> dark mode</button>
        <main class="card">
            <img class="card__photo"
                src="asad.png"
                alt="My photo">
                <h1 class="card__name"> Asad Mohamed Abdi </h1>
                <p class="card__title"> Junior Developer  </p>
                <div class="card__links">
                    <a href="https://github.com/libaaxkatib/Bio-card"> GitHub</a>
                    <a href="https://twitter.com" target="_blank" rel="noopener">Twitter</a>
                    <a href="mailto:hello@example.com">Email</a>
                </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
