<!DOCTYPE html>
<head>
    <title>
        Coffee shop
    </title>
    <style>
.maintitle {
text-align: center;
background-color: rgb(82, 11, 11);
color: rgb(234, 189, 130);
padding: 20px;
border-radius: 10px;

}
body {
    background-color: #efefef;
    font-family:arial;

}

.container {
display: flex;
justify-content: center;
margin-top: 40  px;
gap: 40px;

}
.card {
    background-color: rgb(254, 221, 199);
    width: 400px;
    padding:20px;
    border-radius:10px;
    box-shadow: 0px 0px 10px gray;
    
}
.item {

   display: flex;

   justify-content: space-between;

   align-items: center;
   gap:20px;
   margin-top:20px;
font-weight: bold;
}
.item-left {
    display: flex;
    gap:10px;
    align-items: flex-start;
}
p {
    margin:0px;

}
.coffee-name {
    font-weight: bold;
}
 .coffee-info {
    color:rgb(212, 149, 67);
  font-size: 12px;

   font-weight: normal;
}
  

.item {
    border-bottom: 2px solid lightcoral;
    padding-bottom: 20px;
    margin-top: 20px;
}

input {

    width: 300px;
    padding:10px;
    border-radius: 10px;

}

input {

   width: 300px;

   padding: 12px 20px;

   border: 2px solid rgb(143, 98, 53);

   border-radius: 15px;

   background-color: rgb(254, 221, 199);

}
.input-group {

   position: relative;
display: inline-block;
padding: 0 5px;
}
label {

   position: absolute;

   top: -10px;

   left: 20px;

   background-color: rgb(254, 221, 199);

   padding: 0 10px;

   color: rgb(106, 60, 0);

   font-size: 14px;

}

.small-card {
height: 90px;
padding-top: 5px;
}
h3 {

   font-size: 16px;

   font-weight: bold;

}
.items {
    font-weight: bold;

}

.right-side {

display: flex;

flex-direction: column;

gap: 20px;

}

    </style>

</head>
<body>
<h1 class="maintitle"> Coffee Masters </h1>

<div class="container">
<div class="card">
  <p class="items"> Items</p>  
    
     <div class="item">
    <div class="item-left">
       <p> 1x </p> 
       <div> <p class="coffee-name"> cappuccino </p>
            <p class="coffee-info">Lite foam</p>
    </div>
        
    </div>
    $3.35
  </div>
   <div class="item">
    <div class="item-left">
       <p> 1x </p> 
       <div> <p class="coffee-name"> cappuccino </p>
            <p class="coffee-info">Lite milk</p>
            <p class="coffee-info">Double espresso</p>
    </div>
         </div>
    $3.85
  </div>
   <div class="item">
    <div class="item-left">
       <p> 1x </p> 
       <div> <p class="coffee-name"> Croissant </p>
            <p class="coffee-info"> butter</p>
            </div>
</div>
    $2.45
  </div>
  </div>
  <div class="right-side">
  <div class="card small-card">
   <h3> Name</h3>
   <div class="input-group"> <label> Name for order </label>
           <input type="text" placeholder="Magaca">
        </div>
        </div>
<div class="card small-card">

   <h3>Payment</h3>
   <div class="input-group">   <label>Card Number</label>   
    <input type="text" placeholder="1234 5678 9012 3456">
    
</div>
</div>
</div>


</body>

</html>
